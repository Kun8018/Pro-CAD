### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
# Built with to_sft_spec_manager.py (teacher distillation with deterministic
# kernel-canonicalized labels). Two records per misleading sample:
#   extract+update trajectory, and unresolved-field questions.
dataset: spec_manager_sft
template: qwen
cutoff_len: 8192
preprocessing_num_workers: 16
dataloader_num_workers: 4
train_on_prompt: false   # loss on assistant turns only (spec JSON targets)
mask_history: false      # train BOTH assistant turns in the extract->update trajectory

### output
output_dir: saves/qwen2_5-7b/full/sft_spec_manager
logging_steps: 10
save_steps: 100
save_total_limit: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
