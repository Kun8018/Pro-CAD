### model
# Single-GPU 12GB reproduction recipe (RTX 3080). QLoRA: 4-bit base + LoRA.
# Peak VRAM target ~10-12GB with cutoff 4096. Paper's main numbers should use
# the full-parameter config; use this one for local iteration / open-model row.
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true
quantization_bit: 4

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
gradient_checkpointing: true

### dataset
dataset: spec_manager_sft
template: qwen
cutoff_len: 4096
preprocessing_num_workers: 8
dataloader_num_workers: 2
train_on_prompt: false
mask_history: false

### output
output_dir: saves/qwen2_5-7b/qlora/sft_spec_manager
logging_steps: 10
save_steps: 100
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
resume_from_checkpoint: null

### merge for standalone use afterwards:
#   llamafactory-cli export ... --export_merged_model_dir saves/spec_manager_merged
# then run: --spec-manager-model saves/spec_manager_merged
